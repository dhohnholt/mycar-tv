name: CarPlayTV
options:
  bundleIdPrefix: com.hohnholt
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6BA6YTBG7Z
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarPlayTV:
    type: application
    platform: iOS
    sources: [CarPlayTV]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hohnholt.carplaytv
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CarPlayTV/CarPlayTV.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Paste your iOS OAuth client ID from Google Cloud Console here (see README).
        GOOGLE_CLIENT_ID: 969134369183-bc15tr1kmvn2go8dqba6819jcqqi4762.apps.googleusercontent.com
    info:
      path: CarPlayTV/Info.plist
      properties:
        CFBundleDisplayName: Car TV
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Car TV uses your speed to pause video on the CarPlay screen while the vehicle is moving.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Most IPTV providers only serve plain HTTP.
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
